name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, test, build, and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ledgerly_ci
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ledgerly_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/ledgerly_ci?schema=public
      BETTER_AUTH_URL: http://127.0.0.1:4000
      FRONTEND_URL: http://127.0.0.1:3000
      FRONTEND_ORIGIN: http://127.0.0.1:3000
      AUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_BACKEND_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      BACKEND_INTERNAL_URL: http://127.0.0.1:4000
      AI_INSIGHTS_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Create ephemeral test secrets
        shell: bash
        run: |
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npx prisma migrate deploy --schema apps/backend/prisma/schema.prisma

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm test

      - name: Build production applications
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser isolation tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
